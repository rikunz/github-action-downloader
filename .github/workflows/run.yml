name: 1fichier Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - fichier
  pull_request:
    branches:
      - fichier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq chromium-browser chromium-chromedriver
          pip install requests beautifulsoup4 selenium
          chromium-browser --version
          chromedriver --version
          which chromedriver
          ls -l /usr/bin/chromedriver
          

      - name: Process First 1fichier Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f fichier_download_list.txt ]; then
            echo "No fichier_download_list.txt found, exiting"
            exit 0
          fi

          first_link=$(head -n 1 fichier_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "fichier_download_list.txt is empty, exiting"
            exit 0
          fi

          echo "Processing $first_link"

          start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_payload=$(jq -n --arg link "$first_link" --arg time "$start_time" '{
            embeds: [{
              title: "📥 Starting 1fichier Download",
              fields: [
                { name: "1fichier Link", value: "\($link)", inline: true },
                { name: "Started At", value: $time, inline: true }
              ],
              color: 5814783
            }]
          }')
          curl -X POST -H "Content-Type: application/json" -d "$start_payload" "$DISCORD_WEBHOOK_URL"

          link=$(echo "$first_link" | awk -F'&af=' '{print $1}' | tr -d '\r\n')

          echo "Starting download with Selenium..."
          python scripts/selenium_download.py "$link" > selenium_output.txt 2>&1
          selenium_exit_code=$?
          echo "Selenium output:"
          cat selenium_output.txt

          if [ $selenium_exit_code -ne 0 ]; then
            echo "Failed to trigger download with Selenium."
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Trigger Download from 1fichier",
                description: "Link: \($link)\nCheck logs, screenshots, and debug files for details",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

          echo "Waiting for download to initiate..."
          sleep 60
          echo "Disk space:"
          df -h
          echo "Running Chrome processes:"
          ps aux | grep -E 'chromedriver|chromium' || true

          echo "Monitoring download progress..."
          download_complete=false
          timeout=18000
          elapsed=0
          min_size=1048576
          download_dir="/tmp/downloads"
          while [ $elapsed -lt $timeout ]; do
            echo "Contents of download_dir:"
            ls -lh "$download_dir"
            if ls "$download_dir"/*.crdownload >/dev/null 2>&1; then
              file=$(ls "$download_dir"/*.crdownload 2>/dev/null | head -n 1)
              size=$(stat -c %s "$file" 2>/dev/null || echo 0)
              echo "Progress: File $file, Size: $size bytes"
            elif ls "$download_dir"/* >/dev/null 2>&1; then
              filename=$(ls "$download_dir" | grep -v '\.crdownload' | head -n 1)
              if [ -n "$filename" ]; then
                size=$(stat -c %s "$download_dir/$filename")
                if [ $size -ge $min_size ]; then
                  echo "Download complete: $filename, Size: $size bytes"
                  download_complete=true
                  break
                else
                  echo "File $filename found but too small ($size bytes), waiting..."
                fi
              else
                echo "Waiting for download to complete..."
              fi
            else
              echo "Waiting for download to start..."
            fi
            sleep 10
            elapsed=$((elapsed + 10))
          done

          if [ "$download_complete" = true ]; then
            gofile_response=$(curl -s -F "file=@$download_dir/$filename" https://${{ env.server }}.gofile.io/uploadFile)
            if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
              gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
              file_list=$(ls "$download_dir" | sed 's/^/- /' | paste -sd '\n' -)
              upload_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              upload_payload=$(jq -n \
                --arg url "$gofile_url" \
                --arg link "$first_link" \
                --arg time "$upload_time" \
                --arg files "$file_list" '{
                  embeds: [{
                    title: "📤 File Uploaded to Gofile!",
                    description: "Downloaded files:\n\($files)",
                    fields: [
                      { name: "Download Link", value: "[Download from Gofile](\($url))", inline: true },
                      { name: "Source 1fichier Link", value: "\($link)", inline: true },
                      { name: "Uploaded At", value: $time, inline: true }
                    ],
                    color: 5814783
                  }]
                }')
              curl -X POST -H "Content-Type: application/json" -d "$upload_payload" "$DISCORD_WEBHOOK_URL"
              tail -n +2 fichier_download_list.txt > temp.txt
              mv temp.txt fichier_download_list.txt
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt
              if [ -s fichier_download_list.txt ]; then
                git commit -m "Processed first link, removed from fichier_download_list.txt"
              else
                git commit -m "Processed last link, fichier_download_list.txt is now empty"
              fi
              git push
            else
              echo "Failed to upload to Gofile."
              error_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "❌ Failed to Upload to Gofile",
                  description: "Link: \($link)",
                  color: 16711680
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt
              git commit -m "Failed to process first link: $first_link"
              git push
            fi
          else
            echo "Download failed or timed out."
            cat selenium_output.txt
            if [ -f debug_page.html ]; then echo "Saved debug_page.html"; fi
            if [ -f final_page.html ]; then echo "Saved final_page.html"; fi
            if [ -f initial_screenshot.png ]; then echo "Saved initial_screenshot.png"; fi
            if [ -f debug_screenshot.png ]; then echo "Saved debug_screenshot.png"; fi
            if [ -f final_screenshot.png ]; then echo "Saved final_screenshot.png"; fi
            if [ -f selenium_download.log ]; then echo "Saved selenium_download.log"; fi
            if [ -f chromedriver.log ]; then echo "Saved chromedriver.log"; fi
            if [ -f chrome_processes.log ]; then echo "Saved chrome_processes.log"; fi
            if [ -f chrome_processes_initial.log ]; then echo "Saved chrome_processes_initial.log"; fi
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Download from 1fichier",
                description: "Link: \($link)\nCheck logs, screenshots, and debug files for details",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

          rm -rf selenium_output.txt

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_page.html
            final_page.html
            initial_screenshot.png
            debug_screenshot.png
            final_screenshot.png
            selenium_download.log
            chromedriver.log
            chrome_processes.log
            chrome_processes_initial.log
          if-no-files-found: warn