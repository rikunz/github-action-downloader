name: Mega Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget gnupg
          wget -q -O - https://mega.nz/linux/repo/xUbuntu_24.04/Release.key | sudo apt-key add -
          echo "deb https://mega.nz/linux/repo/xUbuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/mega.list
          sudo apt-get update
          sudo apt-get install -y megacmd

      - name: Debug mega-cmd installation
        run: |
          echo "Checking mega-cmd installation..."
          which mega-get || echo "mega-get not found"
          mega-get --version || echo "mega-get version check failed"
          ls -l /usr/bin/mega-*

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Get Gofile server
        id: gofile_server
        run: |
          response=$(curl -s https://api.gofile.io/servers)
          echo "Raw Gofile API response: $response"

          preferred_zones='["asia", "eu", "na"]'
          server="store1"

          if echo "$response" | jq -e '.data.serversAllZone' > /dev/null 2>&1; then
            for zone in $(echo $preferred_zones | jq -r '.[]'); do
              candidate=$(echo "$response" | jq -r --arg zone "$zone" '.data.serversAllZone[] | select(.zone == $zone) | .name' | head -n 1)
              if [ -n "$candidate" ]; then
                server="$candidate"
                break
              fi
            done
            echo "Selected server based on preferred zone: $server"
          else
            echo "Failed to get valid servers list, using fallback: $server"
          fi

          echo "server=$server" >> $GITHUB_ENV

      - name: Process First Mega Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f mega_download_list.txt ]; then
            echo "No mega_download_list.txt found, exiting"
            exit 0
          fi

          first_link=$(head -n 1 mega_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "mega_download_list.txt is empty, exiting"
            exit 0
          fi

          echo "Processing $first_link"

          start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_payload=$(jq -n --arg link "$first_link" --arg time "$start_time" '{
            embeds: [{
              title: "📥 Starting Mega Download",
              fields: [
                { name: "Mega Link", value: "[Mega Link](\($link))", inline: true },
                { name: "Started At", value: $time, inline: true }
              ],
              color: 5814783
            }]
          }')
          curl -X POST -H "Content-Type: application/json" -d "$start_payload" "$DISCORD_WEBHOOK_URL"

          rm -rf downloads/*
          success=true

          if ! mega-get "$first_link" downloads/; then
            echo "Failed to download $first_link"
            success=false
            # Kirim notifikasi ke Discord kalau gagal
            error_message=$(<mega_error.log)
            error_payload=$(jq -n \
              --arg link "$first_link" \
              --arg error "$error_message" '{
                embeds: [{
                  title: "❌ Failed to Download from Mega",
                  description: "Link: \($link)\nError:\n```bash\n\($error)\n```",
                  color: 16711680
                }]
              }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            
          else
            gofile_urls=()
            for file in downloads/*; do
              if [ -f "$file" ]; then
                echo "Uploading $file to Gofile"
                gofile_response=$(curl -s -F "file=@$file" https://${{ env.server }}.gofile.io/uploadFile)
                if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
                  gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
                  gofile_urls+=("$gofile_url")
                else
                  echo "Failed to upload $file"
                  success=false
                fi
                rm -f "$file"
              fi
            done

          if [ "$success" = true ]; then
            for url in "${gofile_urls[@]}"; do
              upload_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
              # Buat list file yang diunduh
              file_list=""
              for file in downloads/*; do
                [ -f "$file" ] && file_list="${file_list}• $(basename "$file")\n"
              done
              file_list=${file_list%\\n}  # Hapus newline terakhir
          
              upload_payload=$(jq -n \
                --arg url "$url" \
                --arg link "$first_link" \
                --arg time "$upload_time" \
                --arg files "$file_list" '{
                  embeds: [{
                    title: "📤 File Uploaded to Gofile!",
                    description: "Downloaded files:\n\($files)",
                    fields: [
                      { name: "Download Link", value: "[Download from Gofile](\($url))", inline: true },
                      { name: "Source Mega Link", value: "[Mega Link](\($link))", inline: true },
                      { name: "Uploaded At", value: $time, inline: true }
                    ],
                    color: 5814783
                  }]
                }')
          
              curl -X POST -H "Content-Type: application/json" -d "$upload_payload" "$DISCORD_WEBHOOK_URL"
            done
          fi
          
          if [ "$success" = true ]; then
            tail -n +2 mega_download_list.txt > temp.txt
            mv temp.txt mega_download_list.txt
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add mega_download_list.txt
            if [ -s mega_download_list.txt ]; then
              git commit -m "Processed first link, removed from mega_download_list.txt"
            else
              git commit -m "Processed last link, mega_download_list.txt is now empty"
            fi
            git push
          else
            echo "First link failed, keeping mega_download_list.txt unchanged"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add mega_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
          fi
