name: Mega Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget gnupg
          # Add Mega's APT repository
          wget -q -O - https://mega.nz/linux/repo/xUbuntu_24.04/Release.key | sudo apt-key add -
          echo "deb https://mega.nz/linux/repo/xUbuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/mega.list
          sudo apt-get update
          sudo apt-get install -y megacmd

      - name: Debug mega-cmd installation
        run: |
          echo "Checking mega-cmd installation..."
          which mega-get || echo "mega-get not found"
          mega-get --version || echo "mega-get version check failed"
          ls -l /usr/bin/mega-*

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Get Gofile server
        id: gofile_server
        run: |
          response=$(curl -s https://api.gofile.io/getServer)
          echo "Raw Gofile API response: $response"
          if echo "$response" | jq -e '.data.server' > /dev/null 2>&1; then
            server=$(echo "$response" | jq -r '.data.server')
            echo "server=$server" >> $GITHUB_ENV
          else
            echo "Failed to get Gofile server, using fallback: store1"
            echo "server=store1" >> $GITHUB_ENV
          fi

      - name: Process First Mega Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f mega_download_list.txt ]; then
            echo "No mega_download_list.txt found, exiting"
            exit 0
          fi
          first_link=$(head -n 1 mega_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "mega_download_list.txt is empty, exiting"
            exit 0
          fi
          echo "Processing $first_link"
          # Send pre-download notification
          curl -X POST -H "Content-Type: application/json" -d @- $DISCORD_WEBHOOK_URL <<EOF
          {
            "embeds": [{
              "title": "📥 Starting Mega Download",
              "fields": [
                {
                  "name": "Mega Link",
                  "value": "[Mega Link]($first_link)",
                  "inline": true
                },
                {
                  "name": "Started At",
                  "value": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                  "inline": true
                }
              ],
              "color": 5814783
            }]
          }
          EOF
          rm -rf downloads/*
          success=true
          if ! mega-get "$first_link" downloads/; then
            echo "Failed to download $first_link"
            success=false
          else
            gofile_urls=()
            for file in downloads/*; do
              if [ -f "$file" ]; then
                echo "Uploading $file to Gofile"
                gofile_response=$(curl -s -F "file=@$file" https://${{ env.server }}.gofile.io/uploadFile)
                if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
                  gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
                  gofile_urls+=("$gofile_url")
                else
                  echo "Failed to upload $file"
                  success=false
                fi
                rm -f "$file"
              fi
            done
            if [ "$success" = true ]; then
              for url in "${gofile_urls[@]}"; do
                curl -X POST -H "Content-Type: application/json" -d @- $DISCORD_WEBHOOK_URL <<EOF
                {
                  "embeds": [{
                    "title": "📤 File Uploaded to Gofile!",
                    "fields": [
                      {
                        "name": "Download Link",
                        "value": "[Download from Gofile]($url)",
                        "inline": true
                      },
                      {
                        "name": "Source Mega Link",
                        "value": "[Mega Link]($first_link)",
                        "inline": true
                      },
                      {
                        "name": "Uploaded At",
                        "value": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                        "inline": true
                      }
                    ],
                    "color": 5814783
                  }]
                }
                EOF
              done
            fi
          fi
          # Update mega_download_list.txt
          if [ "$success" = true ]; then
            # Remove first line, keep the rest
            tail -n +2 mega_download_list.txt > temp.txt
            mv temp.txt mega_download_list.txt
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add mega_download_list.txt
            if [ -s mega_download_list.txt ]; then
              git commit -m "Processed first link, removed from mega_download_list.txt"
            else
              git commit -m "Processed last link, mega_download_list.txt is now empty"
            fi
            git push
          else
            echo "First link failed, keeping mega_download_list.txt unchanged"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add mega_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
          fi
