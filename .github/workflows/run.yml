```yaml
name: 1fichier Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - fichier
  pull_request:
    branches:
      - fichier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests beautifulsoup4

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Get Gofile server
        id: gofile_server
        run: |
          response=$(curl -s https://api.gofile.io/servers)
          echo "Raw Gofile API response: $response"

          preferred_zones='["asia", "eu", "na"]'
          server="store1"

          if echo "$response" | jq -e '.data.serversAllZone' > /dev/null 2>&1; then
            for zone in $(echo $preferred_zones | jq -r '.[]'); do
              candidate=$(echo "$response" | jq -r --arg zone "$zone" '.data.serversAllZone[] | select(.zone == $zone) | .name' | head -n 1)
              if [ -n "$candidate" ]; then
                server="$candidate"
                break
              fi
            done
            echo "Selected server based on preferred zone: $server"
          else
            echo "Failed to get valid servers list, using fallback: $server"
          fi

          echo "server=$server" >> $GITHUB_ENV

      - name: Process First 1fichier Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f fichier_download_list.txt ]; then
            echo "No fichier_download_list.txt found, exiting"
            exit 0
          fi

          first_link=$(head -n 1 fichier_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "fichier_download_list.txt is empty, exiting"
            exit 0
          fi

          echo "Processing $first_link"

          start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_payload=$(jq -n --arg link "$first_link" --arg time "$start_time" '{
            embeds: [{
              title: "📥 Starting 1fichier Download",
              fields: [
                { name: "1fichier Link", value: "\($link)", inline: true },
                { name: "Started At", value: $time, inline: true }
              ],
              color: 5814783
            }]
          }')
          curl -s -X POST -H "Content-Type: application/json" -d "$start_payload" "$DISCORD_WEBHOOK_URL"

          # Clean the link (remove af= parameter if present)
          link=$(echo "$first_link" | awk -F'&af=' '{print $1}')

          # Temporary directory
          temp_dir=$(mktemp -d)

          # Initialize downloaded_files.txt if it doesn't exist
          if [ ! -f downloaded_files.txt ]; then
            touch downloaded_files.txt
          fi

          # Create Python script to extract download URL, filename, and cookies
          cat << 'EOF' > extract_1fichier_url.py
          import requests
          from bs4 import BeautifulSoup
          import sys
          import re
          import uuid
          import base64
          import os

          def extract_1fichier_url(url):
              try:
                  # Create a session to persist cookies
                  session = requests.Session()
                  session.headers.update({
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Connection": "keep-alive",
                      "Referer": "https://1fichier.com/",
                      "sec-ch-ua": '\"Google Chrome\";v=\"135\", \"Not-A.Brand\";v=\"8\", \"Chromium\";v=\"135\"',
                      "sec-ch-ua-mobile": "?0",
                      "sec-ch-ua-platform": '\"Windows\"',
                      "Sec-Fetch-Dest": "document",
                      "Sec-Fetch-Mode": "navigate",
                      "Sec-Fetch-Site": "same-site",
                      "Sec-Fetch-User": "?1",
                      "Upgrade-Insecure-Requests": "1"
                  })

                  # Initial GET request
                  response = session.get(url, allow_redirects=True)
                  if response.status_code != 200:
                      print(f"Failed to access URL: Status {response.status_code}")
                      with open("debug_get.html", "w", encoding="utf-8") as f:
                          f.write(response.text)
                      return None, None, None

                  # Save GET response HTML for debugging
                  with open("debug_get.html", "w", encoding="utf-8") as f:
                      f.write(response.text)

                  # Parse HTML to extract adz and filename
                  soup = BeautifulSoup(response.content, 'html.parser')
                  adz_input = soup.find('input', {'name': 'adz'})
                  if not adz_input:
                      print("Could not find adz input")
                      return None, None, None
                  adz = adz_input.get('value', '')

                  filename_elements = soup.find_all('td', class_='normal')
                  if len(filename_elements) < 2:
                      print("Could not find filename")
                      return None, None, None
                  filename = filename_elements[1].text.strip()

                  # Try to extract cookies from HTML or response
                  cookies = {}
                  html_content = str(soup)
                  shared_id_match = re.search(r'_sharedID\s*[:=]\s*[\'"]([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})[\'"]', html_content, re.IGNORECASE)
                  cst_match = re.search(r'_sharedID_cst\s*[:=]\s*[\'"]([A-Za-z0-9+/=]+)[\'"]', html_content, re.IGNORECASE)

                  if shared_id_match:
                      cookies['_sharedID'] = shared_id_match.group(1)
                      print(f"Found _sharedID in HTML: {cookies['_sharedID']}")
                  if cst_match:
                      cookies['_sharedID_cst'] = cst_match.group(1)
                      print(f"Found _sharedID_cst in HTML: {cookies['_sharedID_cst']}")

                  # Check response cookies as fallback
                  if not cookies:
                      for cookie_name, cookie_value in session.cookies.items():
                          if cookie_name in ['_sharedID', '_sharedID_cst']:
                              cookies[cookie_name] = cookie_value
                              print(f"Found {cookie_name} in response cookies: {cookie_value}")
                      if cookies:
                          print("Cookies found in response headers")
                      else:
                          print("No cookies found in HTML or response, generating mock cookies")
                          cookies['_sharedID'] = str(uuid.uuid4())
                          random_bytes = os.urandom(8)
                          cookies['_sharedID_cst'] = base64.b64encode(random_bytes).decode('utf-8').rstrip('=')

                  cookies_str = "; ".join([f"{key}={value}" for key, value in cookies.items()])

                  # POST request to get download page
                  data = {"adz": adz, "did": 0, "dlinline": "on"}
                  post_response = session.post(url, data=data, allow_redirects=True)
                  if post_response.status_code != 200:
                      print(f"POST request failed: Status {post_response.status_code}")
                      with open("debug_post.html", "w", encoding="utf-8") as f:
                          f.write(post_response.text)
                      return None, None, None

                  # Save POST response HTML for debugging
                  with open("debug_post.html", "w", encoding="utf-8") as f:
                      f.write(post_response.text)

                  # Parse POST response to find download link
                  soup = BeautifulSoup(post_response.content, 'html.parser')
                  links = soup.find_all('a', class_='ok btn-general btn-orange')
                  download_url = None
                  for link in links:
                      if "Click here to download the file" in link.text:
                          download_url = link.get('href')
                          break

                  if not download_url:
                      print("Could not find download URL")
                      return None, None, None

                  # Define headers for curl
                  headers = [
                      "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7",
                      "Accept-Encoding: gzip, deflate, br, zstd",
                      "Accept-Language: en-US,en;q=0.9",
                      "Connection: keep-alive",
                      f"Cookie: {cookies_str}",
                      "Referer: https://1fichier.com/",
                      "sec-ch-ua: \"Google Chrome\";v=\"135\", \"Not-A.Brand\";v=\"8\", \"Chromium\";v=\"135\"",
                      "sec-ch-ua-mobile: ?0",
                      "sec-ch-ua-platform: \"Windows\"",
                      "Sec-Fetch-Dest: document",
                      "Sec-Fetch-Mode: navigate",
                      "Sec-Fetch-Site: same-site",
                      "Sec-Fetch-User: ?1",
                      "Upgrade-Insecure-Requests: 1",
                      "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36"
                  ]

                  headers_str = " ".join([f"-H '{header}'" for header in headers])

                  return download_url, filename, cookies_str, headers_str
              except Exception as e:
                  print(f"Error during extraction: {str(e)}")
                  return None, None, None

          if __name__ == "__main__":
              if len(sys.argv) != 2:
                  print("Usage: python extract_1fichier_url.py <url>")
                  sys.exit(1)
              url = sys.argv[1]
              download_url, filename, cookies, headers = extract_1fichier_url(url)
              if download_url and filename and cookies and headers:
                  print(f"DOWNLOAD_URL={download_url}")
                  print(f"FILENAME={filename}")
                  print(f"COOKIES={cookies}")
                  print(f"HEADERS={headers}")
              else:
                  print("Extraction failed")
                  sys.exit(1)
          EOF

          # Run the Python script to extract download URL, filename, cookies, and headers
          python extract_1fichier_url.py "$link" > extract_output.txt 2>&1
          extract_exit_code=$?

          # Extract download URL, filename, cookies, and headers from output
          download_url=$(grep "DOWNLOAD_URL=" extract_output.txt | cut -d'=' -f2-)
          filename=$(grep "FILENAME=" extract_output.txt | cut -d'=' -f2-)
          cookies=$(grep "COOKIES=" extract_output.txt | cut -d'=' -f2-)
          headers=$(grep "HEADERS=" extract_output.txt | cut -d'=' -f2-)

          # Check if extraction was successful
          if [ $extract_exit_code -eq 0 ] && [ -n "$download_url" ] && [ -n "$filename" ]; then
            # Log the download URL, cookies, and headers
            echo "Download URL: $download_url"
            echo "Cookies: $cookies"
            echo "Headers (raw): $headers"
            echo "Headers (formatted):"
            echo "$headers" | sed "s/-H '//g; s/'$//g" | tr ' ' '\n' | while IFS= read -r header; do
              [ -n "$header" ] && echo "  $header"
            done

            # Warn if cookies are mocked
            if grep -q "No cookies found in HTML or response" extract_output.txt; then
              echo "Warning: Cookies were mocked. Download may fail if real cookies are required."
              warning_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "⚠️ Cookies Mocked",
                  description: "Link: \($link)\nNo cookies found in HTML or response, using mocked cookies. Check logs for details.",
                  color: 16776960
                }]
              }')
              curl -s -X POST -H "Content-Type: application/json" -d "$warning_payload" "$DISCORD_WEBHOOK_URL"
            fi

            # Download the file using curl, showing progress
            echo "Starting download..."
            echo "curl -C - --retry 10 --retry-delay 10 $headers \"$download_url\" --output \"$temp_dir/$filename\""
            curl -C - --retry 10 --retry-delay 10 $headers "$download_url" --output "$temp_dir/$filename"
            download_exit_code=$?

            # Check if download was successful
            if [ $download_exit_code -eq 0 ] && [ -f "$temp_dir/$filename" ] && [ -s "$temp_dir/$filename" ]; then
              # Upload to Gofile
              gofile_response=$(curl -s -F "file=@$temp_dir/$filename" https://${{ env.server }}.gofile.io/uploadFile)
              if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
                gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
                # Append filename to downloaded_files.txt
                echo "- $filename" >> downloaded_files.txt
                # Read the list of downloaded files
                file_list=$(cat downloaded_files.txt | tr '\n' '\n' | paste -sd '\n' -)
                # Send success notification
                upload_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                upload_payload=$(jq -n \
                  --arg url "$gofile_url" \
                  --arg link "$first_link" \
                  --arg time "$upload_time" \
                  --arg files "$file_list" '{
                    embeds: [{
                      title: "📤 File Uploaded to Gofile!",
                      description: "Downloaded files:\n\($files)",
                      fields: [
                        { name: "Download Link", value: "[Download from Gofile](\($url))", inline: true },
                        { name: "Source 1fichier Link", value: "\($link)", inline: true },
                        { name: "Uploaded At", value: $time, inline: true }
                      ],
                      color: 5814783
                    }]
                  }')
                curl -s -X POST -H "Content-Type: application/json" -d "$upload_payload" "$DISCORD_WEBHOOK_URL"
                # Remove first line from fichier_download_list.txt
                tail -n +2 fichier_download_list.txt > temp.txt
                mv temp.txt fichier_download_list.txt
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git add fichier_download_list.txt downloaded_files.txt
                if [ -s fichier_download_list.txt ]; then
                  git commit -m "Processed first link, removed from fichier_download_list.txt, updated downloaded_files.txt"
                else
                  git commit -m "Processed last link, fichier_download_list.txt is now empty, updated downloaded_files.txt"
                fi
                git push
              else
                echo "Failed to upload to Gofile."
                error_payload=$(jq -n --arg link "$first_link" '{
                  embeds: [{
                    title: "❌ Failed to Upload to Gofile",
                    description: "Link: \($link)",
                    color: 16711680
                  }]
                }')
                curl -s -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
                # Keep the link and commit
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git add fichier_download_list.txt downloaded_files.txt
                git commit -m "Failed to process first link: $first_link"
                git push
              fi
            else
              echo "Download failed."
              cat extract_output.txt
              if [ -f debug_get.html ]; then
                echo "GET response HTML saved to debug_get.html"
              fi
              if [ -f debug_post.html ]; then
                echo "POST response HTML saved to debug_post.html"
              fi
              error_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "❌ Failed to Download from 1fichier",
                  description: "Link: \($link)\nCheck logs and debug HTML files for details.",
                  color: 16711680
                }]
              }')
              curl -s -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
              # Keep the link and commit
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt downloaded_files.txt
              git commit -m "Failed to process first link: $first_link"
              git push
            fi
          else
            echo "Failed to extract download URL or filename."
            cat extract_output.txt
            if [ -f debug_get.html ]; then
              echo "GET response HTML saved to debug_get.html"
            fi
            if [ -f debug_post.html ]; then
              echo "POST response HTML saved to debug_post.html"
            fi
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Extract 1fichier Download URL",
                description: "Link: \($link)\nCheck logs and debug HTML files for details. Possible CAPTCHA or anti-bot measures detected.",
                color: 16711680
              }]
            }')
            curl -s -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            # Keep the link and commit
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt downloaded_files.txt
            git commit -m "Failed to process first link: $first_link"
            git push
          fi

          # Clean up
          rm -rf "$temp_dir" extract_1fichier_url.py extract_output.txt debug_get.html debug_post.html
```
