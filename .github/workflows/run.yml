name: 1fichier Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - fichier
  pull_request:
    branches:
      - fichier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq chromium-browser chromium-chromedriver
          pip install requests beautifulsoup4 selenium

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Get Gofile server
        id: gofile_server
        run: |
          response=$(curl -s https://api.gofile.io/servers)
          echo "Raw Gofile API response: $response"

          preferred_zones='["asia", "eu", "na"]'
          server="store1"

          if echo "$response" | jq -e '.data.serversAllZone' > /dev/null 2>&1; then
            for zone in $(echo $preferred_zones | jq -r '.[]'); do
              candidate=$(echo "$response" | jq -r --arg zone "$zone" '.data.serversAllZone[] | select(.zone == $zone) | .name' | head -n 1)
              if [ -n "$candidate" ]; then
                server="$candidate"
                break
              fi
            done
            echo "Selected server based on preferred zone: $server"
          else
            echo "Failed to get valid servers list, using fallback: $server"
          fi

          echo "server=$server" >> $GITHUB_ENV

      - name: Process First 1fichier Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f fichier_download_list.txt ]; then
            echo "No fichier_download_list.txt found, exiting"
            exit 0
          fi

          first_link=$(head -n 1 fichier_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "fichier_download_list.txt is empty, exiting"
            exit 0
          fi

          echo "Processing $first_link"

          start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_payload=$(jq -n --arg link "$first_link" --arg time "$start_time" '{
            embeds: [{
              title: "📥 Starting 1fichier Download",
              fields: [
                { name: "1fichier Link", value: "\($link)", inline: true },
                { name: "Started At", value: $time, inline: true }
              ],
              color: 5814783
            }]
          }')
          curl -X POST -H "Content-Type: application/json" -d "$start_payload" "$DISCORD_WEBHOOK_URL"

          # Clean the link (remove af= parameter if present)
          link=$(echo "$first_link" | awk -F'&af=' '{print $1}')

          # Temporary directory
          temp_dir=$(mktemp -d)

          # Initialize downloaded_files.txt if it doesn't exist
          if [ ! -f downloaded_files.txt ]; then
            touch downloaded_files.txt
          fi

          # Create Python script to extract download URL, filename, cookies (via Selenium), and essential headers
          cat << 'EOF' > extract_1fichier_url.py
          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import sys
          import time

          def extract_1fichier_url(url):
              try:
                  # Set up Selenium with headless Chrome
                  chrome_options = Options()
                  chrome_options.add_argument("--headless")
                  chrome_options.add_argument("--no-sandbox")
                  chrome_options.add_argument("--disable-dev-shm-usage")
                  chrome_options.add_argument("user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
                  driver = webdriver.Chrome(options=chrome_options)

                  try:
                      # Load the page with Selenium
                      driver.get(url)
                      print("Loaded page with Selenium")

                      # Wait for the page to load and check for adz input
                      WebDriverWait(driver, 10).until(
                          EC.presence_of_element_located((By.TAG_NAME, "input"))
                      )

                      # Extract cookies from Selenium
                      cookies = driver.get_cookies()
                      cookies_str = "; ".join([f"{cookie['name']}={cookie['value']}" for cookie in cookies])
                      if not cookies_str:
                          cookies_str = ""
                          print("Warning: No cookies captured from Selenium")

                      # Get page source for parsing with requests/BeautifulSoup
                      page_source = driver.page_source
                  finally:
                      driver.quit()

                  # Parse HTML with BeautifulSoup (faster than Selenium for parsing)
                  soup = BeautifulSoup(page_source, 'html.parser')
                  adz_input = soup.find_all('input')
                  if not adz_input:
                      print("Could not find adz input")
                      return None, None, None, None
                  adz = str(adz_input[0]).replace('<input name="adz" type="hidden" value="', '').replace('"/>', '')

                  filename_elements = soup.find_all('td', class_='normal')
                  if len(filename_elements) < 2:
                      print("Could not find filename")
                      return None, None, None, None
                  filename = str(filename_elements[1]).replace('<td class="normal">', '').replace('</td>', '')

                  # Use requests for POST to get download page (faster than Selenium)
                  session = requests.Session()
                  session.headers.update({
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Connection": "keep-alive"
                  })
                  # Set cookies from Selenium in the requests session
                  for cookie in cookies:
                      session.cookies.set(cookie['name'], cookie['value'])

                  data = {"adz": adz, "did": 0, "dlinline": "on"}
                  post_response = session.post(url, data=data, allow_redirects=True)
                  if post_response.status_code != 200:
                      print(f"POST request failed: Status {post_response.status_code}")
                      return None, None, None, None

                  # Parse POST response to find download link
                  soup = BeautifulSoup(post_response.content, 'html.parser')
                  links = soup.find_all('a')
                  target_text = "Click here to download the file"
                  download_url = None
                  for link in links:
                      if target_text in str(link):
                          download_url = str(link).replace('<a class="ok btn-general btn-orange" href="', '').replace('" style="float:none;margin:auto;font-weight:bold;padding: 10px;margin: 10px;font-size:+1.6em;border:2px solid red">Click here to download the file</a>', '')
                          break

                  if not download_url:
                      print("Could not find download URL")
                      return None, None, None, None

                  # Define essential headers (no Referer)
                  headers = {
                      "User-Agent": session.headers["User-Agent"],
                      "Accept": session.headers["Accept"],
                      "Accept-Language": session.headers["Accept-Language"],
                      "Connection": "keep-alive"
                  }

                  # Format headers for curl
                  headers_str = " ".join([f"-H \"{key}: {value}\"" for key, value in headers.items()])

                  return download_url, filename, cookies_str, headers_str
              except Exception as e:
                  print(f"Error during extraction: {str(e)}")
                  return None, None, None, None

          if __name__ == "__main__":
              if len(sys.argv) != 2:
                  print("Usage: python extract_1fichier_url.py <url>")
                  sys.exit(1)
              url = sys.argv[1]
              download_url, filename, cookies, headers = extract_1fichier_url(url)
              if download_url and filename:
                  print(f"DOWNLOAD_URL={download_url}")
                  print(f"FILENAME={filename}")
                  print(f"COOKIES={cookies}")
                  print(f"HEADERS={headers}")
              else:
                  print("Extraction failed")
                  sys.exit(1)
          EOF

          # Run the Python script to extract download URL, filename, cookies, and headers
          python extract_1fichier_url.py "$link" > extract_output.txt 2>&1
          extract_exit_code=$?

          # Extract download URL, filename, cookies, and headers from output
          download_url=$(grep "DOWNLOAD_URL=" extract_output.txt | cut -d'=' -f2-)
          filename=$(grep "FILENAME=" extract_output.txt | cut -d'=' -f2-)
          cookies=$(grep "COOKIES=" extract_output.txt | cut -d'=' -f2-)
          headers=$(grep "HEADERS=" extract_output.txt | cut -d'=' -f2-)

          # Check if extraction was successful
          if [ $extract_exit_code -eq 0 ] && [ -n "$download_url" ] && [ -n "$filename" ]; then
            # Log the download URL, cookies, and headers
            echo "Download URL: $download_url"
            echo "Cookies: $cookies"
            echo "Headers (raw): $headers"
            # Format headers for better readability, with fallback for empty headers
            if [ -n "$headers" ]; then
              echo "Headers (formatted):"
              echo "$headers" | grep -o -E '-H "[^"]+"' | sed 's/-H "//; s/"$//' | while IFS= read -r header; do
                echo "  $header"
              done
            else
              echo "Headers (formatted): None"
            fi

            # Warn if cookies are empty
            if [ -z "$cookies" ]; then
              echo "Warning: No cookies captured. Download may fail if cookies are required."
              warning_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "⚠️ No Cookies Captured",
                  description: "Link: \($link)\nNo cookies were captured during extraction with Selenium. This may indicate a CAPTCHA or anti-bot measures. Check logs for details.",
                  color: 16776960
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$warning_payload" "$DISCORD_WEBHOOK_URL"
            fi

            # Download the file using curl with cookies and headers
            echo "Starting download..."
            # Use eval to safely handle headers string
            eval curl -C - --retry 10 --retry-delay 10 ${cookies:+"--cookie \"$cookies\""} $headers "$download_url" --output "$temp_dir/$filename"
            download_exit_code=$?

            # Check if download was successful
            if [ $download_exit_code -eq 0 ] && [ -f "$temp_dir/$filename" ]; then
              # Upload to Gofile
              gofile_response=$(curl -s -F "file=@$temp_dir/$filename" https://${{ env.server }}.gofile.io/uploadFile)
              if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
                gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
                # Append filename to downloaded_files.txt
                echo "- $filename" >> downloaded_files.txt
                # Read the list of downloaded files
                file_list=$(cat downloaded_files.txt | tr '\n' '\n' | paste -sd '\n' -)
                # Send success notification
                upload_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                upload_payload=$(jq -n \
                  --arg url "$gofile_url" \
                  --arg link "$first_link" \
                  --arg time "$upload_time" \
                  --arg files "$file_list" '{
                    embeds: [{
                      title: "📤 File Uploaded to Gofile!",
                      description: "Downloaded files:\n\($files)",
                      fields: [
                        { name: "Download Link", value: "[Download from Gofile](\($url))", inline: true },
                        { name: "Source 1fichier Link", value: "\($link)", inline: true },
                        { name: "Uploaded At", value: $time, inline: true }
                      ],
                      color: 5814783
                    }]
                  }')
                curl -X POST -H "Content-Type: application/json" -d "$upload_payload" "$DISCORD_WEBHOOK_URL"
                # Remove first line from fichier_download_list.txt
                tail -n +2 fichier_download_list.txt > temp.txt
                mv temp.txt fichier_download_list.txt
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git add fichier_download_list.txt downloaded_files.txt
                if [ -s fichier_download_list.txt ]; then
                  git commit -m "Processed first link, removed from fichier_download_list.txt, updated downloaded_files.txt"
                else
                  git commit -m "Processed last link, fichier_download_list.txt is now empty, updated downloaded_files.txt"
                fi
                git push
              else
                echo "Failed to upload to Gofile."
                error_payload=$(jq -n --arg link "$first_link" '{
                  embeds: [{
                    title: "❌ Failed to Upload to Gofile",
                    description: "Link: \($link)",
                    color: 16711680
                  }]
                }')
                curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
                # Keep the link and commit
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git add fichier_download_list.txt downloaded_files.txt
                git commit -m "Failed to process first link: $first_link"
                git push
              fi
            else
              echo "Download failed."
              cat extract_output.txt
              error_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "❌ Failed to Download from 1fichier",
                  description: "Link: \($link)\nCheck logs for details.",
                  color: 16711680
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
              # Keep the link and commit
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt downloaded_files.txt
              git commit -m "Failed to process first link: $first_link"
              git push
            fi
          else
            echo "Failed to extract download URL or filename."
            cat extract_output.txt
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Extract 1fichier Download URL",
                description: "Link: \($link)\nCheck logs for details. Possible CAPTCHA or anti-bot measures detected.",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            # Keep the link and commit
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt downloaded_files.txt
            git commit -m "Failed to process first link: $first_link"
            git push
          fi

          # Clean up
          rm -rf "$temp_dir" extract_1fichier_url.py extract_output.txt
