name: 1fichier Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - fichier
  pull_request:
    branches:
      - fichier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          # Install Node.js and npm
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          # Install Puppeteer dependencies
          sudo apt-get install -y chromium-browser
          npm install puppeteer

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Get Gofile server
        id: gofile_server
        run: |
          response=$(curl -s https://api.gofile.io/servers)
          echo "Raw Gofile API response: $response"

          preferred_zones='["asia", "eu", "na"]'
          server="store1"

          if echo "$response" | jq -e '.data.serversAllZone' > /dev/null 2>&1; then
            for zone in $(echo $preferred_zones | jq -r '.[]'); do
              candidate=$(echo "$response" | jq -r --arg zone "$zone" '.data.serversAllZone[] | select(.zone == $zone) | .name' | head -n 1)
              if [ -n "$candidate" ]; then
                server="$candidate"
                break
              fi
            done
            echo "Selected server based on preferred zone: $server"
          else
            echo "Failed to get valid servers list, using fallback: $server"
          fi

          echo "server=$server" >> $GITHUB_ENV

      - name: Process First 1fichier Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f fichier_download_list.txt ]; then
            echo "No fichier_download_list.txt found, exiting"
            exit 0
          fi

          first_link=$(head -n 1 fichier_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "fichier_download_list.txt is empty, exiting"
            exit 0
          fi

          echo "Processing $first_link"

          start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_payload=$(jq -n --arg link "$first_link" --arg time "$start_time" '{
            embeds: [{
              title: "📥 Starting 1fichier Download",
              fields: [
                { name: "1fichier Link", value: "\($link)", inline: true },
                { name: "Started At", value: $time, inline: true }
              ],
              color: 5814783
            }]
          }')
          curl -X POST -H "Content-Type: application/json" -d "$start_payload" "$DISCORD_WEBHOOK_URL"

          # Clean the link (remove af= parameter if present)
          link=$(echo "$first_link" | awk -F'&af=' '{print $1}')

          # Temporary directory
          temp_dir=$(mktemp -d)

          # Initialize downloaded_files.txt if it doesn't exist
          if [ ! -f downloaded_files.txt ]; then
            touch downloaded_files.txt
          fi

          # Create Node.js script to extract download URL, filename, cookies, and headers using Puppeteer
          cat << 'EOF' > extract_1fichier_url.js
          const puppeteer = require('puppeteer');

          async function extract1fichierUrl(url) {
            let browser;
            try {
              // Launch headless Chrome
              browser = await puppeteer.launch({
                executablePath: '/usr/bin/chromium-browser',
                headless: true,
                args: ['--no-sandbox', '--disable-dev-shm-usage']
              });
              const page = await browser.newPage();

              // Set User-Agent
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');

              // Navigate to the URL
              console.log('Loading page with Puppeteer');
              await page.goto(url, { waitUntil: 'networkidle2', timeout: 30000 });

              // Wait for adz input
              await page.waitForSelector('input[name="adz"]', { timeout: 10000 }).catch(() => {
                console.error('Could not find adz input');
                throw new Error('Could not find adz input');
              });

              // Extract adz value
              const adz = await page.$eval('input[name="adz"]', input => input.value);
              if (!adz) {
                console.error('Adz value is empty');
                throw new Error('Adz value is empty');
              }

              // Extract filename
              const filename = await page.$eval('td.normal:nth-child(2)', td => td.textContent.trim());
              if (!filename) {
                console.error('Could not find filename');
                throw new Error('Could not find filename');
              }

              // Perform POST request equivalent by submitting the form
              const postResponse = await page.evaluate(async (adz, url) => {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  body: new URLSearchParams({
                    adz: adz,
                    did: '0',
                    dlinline: 'on'
                  }).toString()
                });
                return await response.text();
              }, adz, url);

              // Parse the POST response to find the download link
              const downloadLinkMatch = postResponse.match(/<a class="ok btn-general btn-orange" href="([^"]+)"/);
              const downloadUrl = downloadLinkMatch ? downloadLinkMatch[1] : null;
              if (!downloadUrl) {
                console.error('Could not find download URL');
                throw new Error('Could not find download URL');
              }

              // Extract cookies
              const cookies = await page.cookies();
              const cookiesStr = cookies.map(cookie => `${cookie.name}=${cookie.value}`).join('; ');
              if (!cookiesStr) {
                console.warn('Warning: No cookies captured from Puppeteer');
              }

              // Define essential headers (no Referer)
              const headers = {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7',
                'Accept-Language': 'en-US,en;q=0.9',
                'Connection': 'keep-alive'
              };

              // Format headers for curl
              const headersStr = Object.entries(headers).map(([key, value]) => `-H "${key}: ${value}"`).join(' ');

              // Output results
              console.log(`DOWNLOAD_URL=${downloadUrl}`);
              console.log(`FILENAME=${filename}`);
              console.log(`COOKIES=${cookiesStr}`);
              console.log(`HEADERS=${headersStr}`);

              return { downloadUrl, filename, cookiesStr, headersStr };
            } catch (error) {
              console.error(`Error during extraction: ${error.message}`);
              process.exit(1);
            } finally {
              if (browser) await browser.close();
            }
          }

          if (require.main === module) {
            if (process.argv.length !== 3) {
              console.error('Usage: node extract_1fichier_url.js <url>');
              process.exit(1);
            }
            const url = process.argv[2];
            extract1fichierUrl(url).catch(error => {
              console.error(`Extraction failed: ${error.message}`);
              process.exit(1);
            });
          }
          EOF

          # Run the Node.js script to extract download URL, filename, cookies, and headers
          node extract_1fichier_url.js "$link" > extract_output.txt 2>&1
          extract_exit_code=$?

          # Extract download URL, filename, cookies, and headers from output
          download_url=$(grep "DOWNLOAD_URL=" extract_output.txt | cut -d'=' -f2-)
          filename=$(grep "FILENAME=" extract_output.txt | cut -d'=' -f2-)
          cookies=$(grep "COOKIES=" extract_output.txt | cut -d'=' -f2-)
          headers=$(grep "HEADERS=" extract_output.txt | cut -d'=' -f2-)

          # Check if extraction was successful
          if [ $extract_exit_code -eq 0 ] && [ -n "$download_url" ] && [ -n "$filename" ]; then
            # Log the download URL, cookies, and headers
            echo "Download URL: $download_url"
            echo "Cookies: $cookies"
            echo "Headers (raw): $headers"
            # Format headers for better readability, with fallback for empty headers
            if [ -n "$headers" ]; then
              echo "Headers (formatted):"
              echo "$headers" | grep -o -E '-H "[^"]+"' | sed 's/-H "//; s/"$//' | while IFS= read -r header; do
                echo "  $header"
              done
            else
              echo "Headers (formatted): None"
            fi

            # Warn if cookies are empty
            if [ -z "$cookies" ]; then
              echo "Warning: No cookies captured. Download may fail if cookies are required."
              warning_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "⚠️ No Cookies Captured",
                  description: "Link: \($link)\nNo cookies were captured during extraction with Puppeteer. This may indicate a CAPTCHA or anti-bot measures. Check logs for details.",
                  color: 16776960
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$warning_payload" "$DISCORD_WEBHOOK_URL"
            fi

            # Download the file using curl with cookies and headers
            echo "Starting download..."
            # Use eval to safely handle headers string
            eval curl -C - --retry 10 --retry-delay 10 ${cookies:+"--cookie \"$cookies\""} $headers "$download_url" --output "$temp_dir/$filename"
            download_exit_code=$?

            # Check if download was successful
            if [ $download_exit_code -eq 0 ] && [ -f "$temp_dir/$filename" ]; then
              # Upload to Gofile
              gofile_response=$(curl -s -F "file=@$temp_dir/$filename" https://${{ env.server }}.gofile.io/uploadFile)
              if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
                gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
                # Append filename to downloaded_files.txt
                echo "- $filename" >> downloaded_files.txt
                # Read the list of downloaded files
                file_list=$(cat downloaded_files.txt | tr '\n' '\n' | paste -sd '\n' -)
                # Send success notification
                upload_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                upload_payload=$(jq -n \
                  --arg url "$gofile_url" \
                  --arg link "$first_link" \
                  --arg time "$upload_time" \
                  --arg files "$file_list" '{
                    embeds: [{
                      title: "📤 File Uploaded to Gofile!",
                      description: "Downloaded files:\n\($files)",
                      fields: [
                        { name: "Download Link", value: "[Download from Gofile](\($url))", inline: true },
                        { name: "Source 1fichier Link", value: "\($link)", inline: true },
                        { name: "Uploaded At", value: $time, inline: true }
                      ],
                      color: 5814783
                    }]
                  }')
                curl -X POST -H "Content-Type: application/json" -d "$upload_payload" "$DISCORD_WEBHOOK_URL"
                # Remove first line from fichier_download_list.txt
                tail -n +2 fichier_download_list.txt > temp.txt
                mv temp.txt fichier_download_list.txt
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git add fichier_download_list.txt downloaded_files.txt
                if [ -s fichier_download_list.txt ]; then
                  git commit -m "Processed first link, removed from fichier_download_list.txt, updated downloaded_files.txt"
                else
                  git commit -m "Processed last link, fichier_download_list.txt is now empty, updated downloaded_files.txt"
                fi
                git push
              else
                echo "Failed to upload to Gofile."
                error_payload=$(jq -n --arg link "$first_link" '{
                  embeds: [{
                    title: "❌ Failed to Upload to Gofile",
                    description: "Link: \($link)",
                    color: 16711680
                  }]
                }')
                curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
                # Keep the link and commit
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git add fichier_download_list.txt downloaded_files.txt
                git commit -m "Failed to process first link: $first_link"
                git push
              fi
            else
              echo "Download failed."
              cat extract_output.txt
              error_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "❌ Failed to Download from 1fichier",
                  description: "Link: \($link)\nCheck logs for details.",
                  color: 16711680
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
              # Keep the link and commit
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt downloaded_files.txt
              git commit -m "Failed to process first link: $first_link"
              git push
            fi
          else
            echo "Failed to extract download URL or filename."
            cat extract_output.txt
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Extract 1fichier Download URL",
                description: "Link: \($link)\nCheck logs for details. Possible CAPTCHA or anti-bot measures detected.",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            # Keep the link and commit
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt downloaded_files.txt
            git commit -m "Failed to process first link: $first_link"
            git push
          fi

          # Clean up
          rm -rf "$temp_dir" extract_1fichier_url.js extract_output.txt
