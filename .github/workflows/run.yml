name: 1fichier Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - fichier
  pull_request:
    branches:
      - fichier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq chromium-browser chromium-chromedriver
          pip install requests beautifulsoup4 selenium

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Get Gofile server
        id: gofile_server
        run: |
          response=$(curl -s https://api.gofile.io/servers)
          preferred_zones='["asia", "eu", "na"]'
          server="store1"
          if echo "$response" | jq -e '.data.serversAllZone' > /dev/null 2>&1; then
            for zone in $(echo $preferred_zones | jq -r '.[]'); do
              candidate=$(echo "$response" | jq -r --arg zone "$zone" '.data.serversAllZone[] | select(.zone == $zone) | .name' | head -n 1)
              if [ -n "$candidate" ]; then
                server="$candidate"
                break
              fi
            done
          fi
          echo "server=$server" >> $GITHUB_ENV

      - name: Download 1fichier File
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f fichier_download_list.txt ]; then
            echo "No fichier_download_list.txt found, exiting"
            exit 0
          fi

          first_link=$(head -n 1 fichier_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "fichier_download_list.txt is empty, exiting"
            exit 0
          fi

          echo "Processing $first_link"
          start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_payload=$(jq -n --arg link "$first_link" --arg time "$start_time" '{
            embeds: [{
              title: "📥 Starting 1fichier Download",
              fields: [
                { name: "1fichier Link", value: "\($link)", inline: true },
                { name: "Started At", value: $time, inline: true }
              ],
              color: 5814783
            }]
          }')
          curl -X POST -H "Content-Type: application/json" -d "$start_payload" "$DISCORD_WEBHOOK_URL"

          link=$(echo "$first_link" | awk -F'&af=' '{print $1}')
          temp_dir=$(mktemp -d)
          touch downloaded_files.txt

          echo "Running Python script..."
          python scripts/extract_1fichier_url.py "$link" > extract_output.txt 2>&1
          extract_exit_code=$?

          echo "Python script output:"
          cat extract_output.txt

          if [ $extract_exit_code -ne 0 ]; then
            echo "Python script failed with exit code $extract_exit_code"
            if [ -f debug_page.html ]; then echo "Saved debug_page.html"; fi
            if [ -f debug_get.html ]; then echo "Saved debug_get.html"; fi
            if [ -f debug_post.html ]; then echo "Saved debug_post.html"; fi
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Extract 1fichier Download URL",
                description: "Link: \($link)\nCheck logs for details.",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt downloaded_files.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

          download_url=$(grep "DOWNLOAD_URL=" extract_output.txt | cut -d'=' -f2-)
          filename=$(grep "FILENAME=" extract_output.txt | cut -d'=' -f2-)
          shared_id=$(grep "SHARED_ID=" extract_output.txt | cut -d'=' -f2-)
          shared_id_cst=$(grep "SHARED_ID_CST=" extract_output.txt | cut -d'=' -f2-)
          user_agent=$(grep "USER_AGENT=" extract_output.txt | cut -d'=' -f2-)

          if [ -n "$download_url" ] && [ -n "$filename" ] && [ -n "$shared_id" ] && [ -n "$shared_id_cst" ] && [ -n "$user_agent" ]; then
            echo "Extraction successful: $filename"
            cookies="_sharedID=$shared_id; _sharedID_cst=$shared_id_cst"
            headers=(
              -H "Cookie: $cookies"
              -H "User-Agent: $user_agent"
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
              -H "Referer: $link"
            )

            max_attempts=5
            attempt=1
            min_size=1048576
            download_success=false
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts: Downloading $filename"
              rm -f "$temp_dir/$filename"
              curl --retry 10 --retry-delay 10 "${headers[@]}" "$download_url" --output "$temp_dir/$filename"
              download_exit_code=$?
              if [ $download_exit_code -ne 0 ]; then
                echo "curl failed with exit code $download_exit_code"
                break
              fi
              if [ -f "$temp_dir/$filename" ]; then
                file_size=$(stat -c %s "$temp_dir/$filename")
                echo "File size: $file_size bytes"
                if [ $file_size -ge $min_size ]; then
                  download_success=true
                  break
                else
                  echo "File too small, retrying..."
                  cp "$temp_dir/$filename" "debug_download_attempt_$attempt.bin"
                fi
              else
                echo "File not downloaded, retrying..."
              fi
              attempt=$((attempt + 1))
              sleep 5
            done

            if [ "$download_success" = true ]; then
              echo "Download successful, saving temp_dir and filename"
              echo "TEMP_DIR=$temp_dir" >> $GITHUB_ENV
              echo "FILENAME=$filename" >> $GITHUB_ENV
            else
              echo "Download failed after $max_attempts attempts or curl error (exit code $download_exit_code)"
              if [ -f "$temp_dir/$filename" ]; then
                cp "$temp_dir/$filename" "debug_download_final.bin"
              fi
              if [ -f debug_get.html ]; then echo "Saved debug_get.html"; fi
              if [ -f debug_post.html ]; then echo "Saved debug_post.html"; fi
              if [ -f debug_page.html ]; then echo "Saved debug_page.html"; fi
              error_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "❌ Failed to Download from 1fichier",
                  description: "Link: \($link)\nCheck logs for details.",
                  color: 16711680
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt downloaded_files.txt
              git commit -m "Failed to process first link: $first_link"
              git push
              exit 1
            fi
          else
            echo "Failed to extract download URL, filename, cookies, or User-Agent"
            if [ -f debug_get.html ]; then echo "Saved debug_get.html"; fi
            if [ -f debug_post.html ]; then echo "Saved debug_post.html"; fi
            if [ -f debug_page.html ]; then echo "Saved debug_page.html"; fi
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Extract 1fichier Download URL",
                description: "Link: \($link)\nCheck logs for details.",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt downloaded_files.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

      - name: Upload to Gofile
        if: env.TEMP_DIR != '' && env.FILENAME != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Uploading ${{ env.FILENAME }} to Gofile..."
          gofile_response=$(curl -s -F "file=@${{ env.TEMP_DIR }}/${{ env.FILENAME }}" https://${{ env.server }}.gofile.io/uploadFile)
          if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
            gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
            echo "- ${{ env.FILENAME }}" >> downloaded_files.txt
            file_list="- ${{ env.FILENAME }}"
            upload_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            upload_payload=$(jq -n \
              --arg url "$gofile_url" \
              --arg link "$(head -n 1 fichier_download_list.txt)" \
              --arg time "$upload_time" \
              --arg files "$file_list" '{
                embeds: [{
                  title: "📤 File Uploaded to Gofile!",
                  description: "Downloaded file:\n\($files)",
                  fields: [
                    { name: "Download Link", value: "[Download from Gofile](\($url))", inline: true },
                    { name: "Source 1fichier Link", value: "\($link)", inline: true },
                    { name: "Uploaded At", value: $time, inline: true }
                  ],
                  color: 5814783
                }]
              }')
            curl -X POST -H "Content-Type: application/json" -d "$upload_payload" "$DISCORD_WEBHOOK_URL"
            tail -n +2 fichier_download_list.txt > temp.txt
            mv temp.txt fichier_download_list.txt
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt downloaded_files.txt
            if [ -s fichier_download_list.txt ]; then
              git commit -m "Processed first link, updated lists"
            else
              git commit -m "Processed last link, lists updated"
            fi
            git push
          else
            echo "Failed to upload to Gofile"
            error_payload=$(jq -n --arg link "$(head -n 1 fichier_download_list.txt)" '{
              embeds: [{
                title: "❌ Failed to Upload to Gofile",
                description: "Link: \($link)",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt downloaded_files.txt
            git commit -m "Failed to process first link"
            git push
            exit 1
          fi

          # Clean up
          rm -rf "${{ env.TEMP_DIR }}" extract_output.txt

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_page.html
            debug_get.html
            debug_post.html
            extract_output.txt
            debug_download_attempt_*.bin
            debug_download_final.bin
