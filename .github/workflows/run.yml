name: 1fichier Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - fichier
  pull_request:
    branches:
      - fichier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq chromium-browser chromium-chromedriver
          pip install requests beautifulsoup4 selenium
          chromium-browser --version
          chromedriver --version
          which chromedriver
          ls -l /usr/bin/chromedriver

      - name: Get Gofile server
        id: gofile_server
        run: |
          response=$(curl -s https://api.gofile.io/servers)
          echo "Raw Gofile API response: $response"

          preferred_zones='["asia", "eu", "na"]'
          server="store1"

          if echo "$response" | jq -e '.data.serversAllZone' > /dev/null 2>&1; then
            for zone in $(echo $preferred_zones | jq -r '.[]'); do
              candidate=$(echo "$response" | jq -r --arg zone "$zone" '.data.serversAllZone[] | select(.zone == $zone) | .name' | head -n 1)
              if [ -n "$candidate" ]; then
                server="$candidate"
                break
              fi
            done
            echo "Selected server based on preferred zone: $server"
          else
            echo "Failed to get valid servers list, using fallback: $server"
          fi

          echo "server=$server" >> $GITHUB_ENV

      - name: Process First 1fichier Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f fichier_download_list.txt ]; then
            echo "No fichier_download_list.txt found, exiting"
            exit 0
          fi

          first_link=$(head -n 1 fichier_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "fichier_download_list.txt is empty, exiting"
            exit 0
          fi

          echo "Processing $first_link"

          # Create download directory with proper permissions
          download_dir="$GITHUB_WORKSPACE/downloads"
          mkdir -p "$download_dir"
          chmod 777 "$download_dir"
          ls -ld "$download_dir"  # Log directory permissions
          echo "Created download directory with proper permissions"

          start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_payload=$(jq -n --arg link "$first_link" --arg time "$start_time" '{
            embeds: [{
              title: "📥 Starting 1fichier Download",
              fields: [
                { name: "1fichier Link", value: "\($link)", inline: true },
                { name: "Started At", value: $time, inline: true }
              ],
              color: 5814783
            }]
          }')
          curl -X POST -H "Content-Type: application/json" -d "$start_payload" "$DISCORD_WEBHOOK_URL"

          link=$(echo "$first_link" | awk -F'&af=' '{print $1}' | tr -d '\r\n')

          echo "Starting download with Selenium..."
          python -u scripts/selenium_download.py "$link" 2>&1 | tee selenium_download.log
          selenium_exit_code=$?

          if [ $selenium_exit_code -ne 0 ]; then
            echo "Failed to trigger download with Selenium."
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Trigger Download from 1fichier",
                description: "Link: \($link)\nCheck logs, screenshots, and debug files for details",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

          echo "Download completed by Selenium script."
          echo "Disk space:"
          df -h
          echo "Running Chrome processes:"
          ps aux | grep -E 'chromedriver|chromium' > chrome_processes_final.log || true
          cat chrome_processes_final.log

          echo "Checking download directory contents..."
          ls -l "$download_dir"

          echo "Starting Gofile upload process..."
          min_size=102400  # 100KB minimum size to filter out temporary files
          completed_file=$(find "$download_dir" -type f -not -name "*.crdownload" -not -name "*.tmp" -not -name ".org.chromium.*" | head -n 1)
          
          if [ -z "$completed_file" ]; then
            echo "No valid completed file found in download directory."
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ No Valid File Downloaded from 1fichier",
                description: "Link: \($link)\nCheck logs, screenshots, and debug files for details",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

          completed_basename=$(basename "$completed_file")
          size=$(stat -c %s "$completed_file")
          if [ $size -lt $min_size ]; then
            echo "File $completed_basename is too small ($size bytes), failing..."
            error_payload=$(jq -n --arg link "$first_link" --arg size "$size" '{
              embeds: [{
                title: "❌ Downloaded File Too Small",
                description: "Link: \($link)\nFile size: \($size) bytes\nCheck logs, screenshots, and debug files for details",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

          echo "Uploading file: $completed_file (size: $size bytes)"
          gofile_response=$(curl -s -F "file=@$completed_file" "https://${{ env.server }}.gofile.io/uploadFile")
          echo "Gofile response: $gofile_response"
          
          if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
            gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
            file_info="- $completed_basename ($(du -h "$completed_file" | cut -f1))"
            upload_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            upload_payload=$(jq -n \
              --arg url "$gofile_url" \
              --arg link "$first_link" \
              --arg time "$upload_time" \
              --arg files "$file_info" '{
                embeds: [{
                  title: "📤 File Uploaded to Gofile!",
                  description: "Downloaded files:\n\($files)",
                  fields: [
                    { name: "Download Link", value: "[Download from Gofile](\($url))", inline: true },
                    { name: "Source 1fichier Link", value: "\($link)", inline: true },
                    { name: "Uploaded At", value: $time, inline: true }
                  ],
                  color: 5814783
                }]
              }')
            curl -X POST -H "Content-Type: application/json" -d "$upload_payload" "$DISCORD_WEBHOOK_URL"
            
            # Remove processed link from list
            tail -n +2 fichier_download_list.txt > temp.txt
            mv temp.txt fichier_download_list.txt
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            if [ -s fichier_download_list.txt ]; then
              git commit -m "Processed first link, removed from fichier_download_list.txt"
            else
              git commit -m "Processed last link, fichier_download_list.txt is now empty"
            fi
            git push
          else
            echo "Failed to upload to Gofile."
            error_payload=$(jq -n --arg link "$first_link" --arg response "$gofile_response" '{
              embeds: [{
                title: "❌ Failed to Upload to Gofile",
                description: "Link: \($link)\nGofile response: \($response)",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_page.html
            final_page.html
            initial_screenshot.png
            debug_screenshot.png
            final_screenshot.png
            selenium_download.log
            chromedriver.log
            chrome_processes_final.log
          if-no-files-found: warn
