name: 1fichier Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - fichier
  pull_request:
    branches:
      - fichier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Get Gofile server
        id: gofile_server
        run: |
          response=$(curl -s https://api.gofile.io/servers)
          echo "Raw Gofile API response: $response"

          preferred_zones='["asia", "eu", "na"]'
          server="store1"

          if echo "$response" | jq -e '.data.serversAllZone' > /dev/null 2>&1; then
            for zone in $(echo $preferred_zones | jq -r '.[]'); do
              candidate=$(echo "$response" | jq -r --arg zone "$zone" '.data.serversAllZone[] | select(.zone == $zone) | .name' | head -n 1)
              if [ -n "$candidate" ]; then
                server="$candidate"
                break
              fi
            done
            echo "Selected server based on preferred zone: $server"
          else
            echo "Failed to get valid servers list, using fallback: $server"
          fi

          echo "server=$server" >> $GITHUB_ENV

      - name: Process First 1fichier Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f fichier_download_list.txt ]; then
            echo "No fichier_download_list.txt found, exiting"
            exit 0
          fi

          first_link=$(head -n 1 fichier_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "fichier_download_list.txt is empty, exiting"
            exit 0
          fi

          echo "Processing $first_link"

          start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_payload=$(jq -n --arg link "$first_link" --arg time "$start_time" '{
            embeds: [{
              title: "📥 Starting 1fichier Download",
              fields: [
                { name: "1fichier Link", value: "\($link)", inline: true },
                { name: "Started At", value: $time, inline: true }
              ],
              color: 5814783
            }]
          }')
          curl -X POST -H "Content-Type: application/json" -d "$start_payload" "$DISCORD_WEBHOOK_URL"

          # Temporary directory
          temp_dir=$(mktemp -d)
          cookie_file=$(mktemp --tmpdir="$temp_dir" cookies.XXX)

          # Try to find a circuit without wait time
          max_count=50
          count=0
          slot_found=false
          while [ $count -lt $max_count ] && [ "$slot_found" = false ]; do
            count=$((count + 1))
            echo "Attempt $count to find a slot..."

            # Get download page
            download_page=$(curl --cookie-jar "$cookie_file" --silent --show-error --connect-timeout 15 --user-agent "Mozilla/5.0 (Windows NT 10.0; rv:109.0) Gecko/20100101 Firefox/115.0" --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" --header "Accept-Language: en-US,en;q=0.5" --header "Accept-Encoding: gzip, deflate, br" --compressed "$first_link")

            # Check if there's a wait time or slot available
            if ! echo "$download_page" | grep -q 'Please wait'; then
              slot_found=true
            fi
          done

          if [ "$slot_found" = false ]; then
            echo "Unable to find a slot after $max_count attempts."
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Find Download Slot",
                description: "Link: \($link)\nAfter 50 attempts",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            # Keep the link and commit
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

          # Find adz value
          adz=$(echo "$download_page" | grep -oP 'name="adz" value="\K[^"]+')
          if [ -z "$adz" ]; then
            echo "Could not find adz value."
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Extract Download Parameters",
                description: "Link: \($link)\nCould not find adz value",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            # Keep the link and commit
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

          # Post the form to get download link page
          download_link_page=$(curl --location --cookie "$cookie_file" --cookie-jar "$cookie_file" --silent --show-error --form "submit=Download" --form "adz=$adz" "$first_link")

          # Extract download link
          download_link=$(echo "$download_page" | grep -oP '<a href="\K[^"]+' | head -1)
          if [ -z "$download_link" ]; then
            echo "Could not extract download link."
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Extract Download Link",
                description: "Link: \($link)",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            # Keep the link and commit
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
            exit 1
          fi

          # Download the file
          curl --cookie "$cookie_file" --referer "$first_link" --output-dir "$temp_dir" --remote-name "$download_link"

          # Check if download was successful
          if [ $? -eq 0 ]; then
            # Find the downloaded file
            downloaded_file=$(ls "$temp_dir")
            if [ -z "$downloaded_file" ]; then
              echo "No file downloaded."
              error_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "❌ Failed to Download from 1fichier",
                  description: "Link: \($link)\nNo file downloaded",
                  color: 16711680
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
              # Keep the link and commit
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt
              git commit -m "Failed to process first link: $first_link"
              git push
              exit 1
            fi
            # Upload to Gofile
            gofile_response=$(curl -s -F "file=@$temp_dir/$downloaded_file" https://${{ env.server }}.gofile.io/uploadFile)
            if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
              gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
              # Send success notification
              upload_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              upload_payload=$(jq -n \
                --arg url "$gofile_url" \
                --arg link "$first_link" \
                --arg time "$upload_time" '{
                  embeds: [{
                    title: "📤 File Uploaded to Gofile!",
                    fields: [
                      { name: "Download Link", value: "[Download from Gofile](\($url))", inline: true },
                      { name: "Source 1fichier Link", value: "\($link)", inline: true },
                      { name: "Uploaded At", value: $time, inline: true }
                    ],
                    color: 5814783
                  }]
                }')
              curl -X POST -H "Content-Type: application/json" -d "$upload_payload" "$DISCORD_WEBHOOK_URL"
              # Remove first line from fichier_download_list.txt
              tail -n +2 fichier_download_list.txt > temp.txt
              mv temp.txt fichier_download_list.txt
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt
              if [ -s fichier_download_list.txt ]; then
                git commit -m "Processed first link, removed from fichier_download_list.txt"
              else
                git commit -m "Processed last link, fichier_download_list.txt is now empty"
              fi
              git push
            else
              echo "Failed to upload to Gofile."
              error_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "❌ Failed to Upload to Gofile",
                  description: "Link: \($link)",
                  color: 16711680
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
              # Keep the link and commit
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt
              git commit -m "Failed to process first link: $first_link"
              git push
            fi
          else
            echo "Download failed."
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Download from 1fichier",
                description: "Link: \($link)",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            # Keep the link and commit
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
          fi

          # Clean up
          rm -rf "$temp_dir"