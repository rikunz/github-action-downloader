```yaml
name: 1fichier Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - fichier
  pull_request:
    branches:
      - fichier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tor
          pip install requests beautifulsoup4

      - name: Start Tor service
        run: |
          sudo systemctl start tor
          sleep 5  # Wait for Tor to initialize
          if ! pgrep -x "tor" > /dev/null; then
            echo "Tor service failed to start"
            exit 1
          fi
          echo "Tor service started successfully"

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Get Gofile server
        id: gofile_server
        run: |
          response=$(curl -s https://api.gofile.io/servers)
          echo "Raw Gofile API response: $response"

          preferred_zones='["asia", "eu", "na"]'
          server="store1"

          if echo "$response" | jq -e '.data.serversAllZone' > /dev/null 2>&1; then
            for zone in $(echo $preferred_zones | jq -r '.[]'); do
              candidate=$(echo "$response" | jq -r --arg zone "$zone" '.data.serversAllZone[] | select(.zone == $zone) | .name' | head -n 1)
              if [ -n "$candidate" ]; then
                server="$candidate"
                break
              fi
            done
            echo "Selected server based on preferred zone: $server"
          else
            echo "Failed to get valid servers list, using fallback: $server"
          fi

          echo "server=$server" >> $GITHUB_ENV

      - name: Process First 1fichier Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f fichier_download_list.txt ]; then
            echo "No fichier_download_list.txt found, exiting"
            exit 0
          fi

          first_link=$(head -n 1 fichier_download_list.txt)
          if [ -z "$first_link" ]; then
            echo "fichier_download_list.txt is empty, exiting"
            exit 0
          fi

          echo "Processing $first_link"

          start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_payload=$(jq -n --arg link "$first_link" --arg time "$start_time" '{
            embeds: [{
              title: "📥 Starting 1fichier Download",
              fields: [
                { name: "1fichier Link", value: "\($link)", inline: true },
                { name: "Started At", value: $time, inline: true }
              ],
              color: 5814783
            }]
          }')
          curl -X POST -H "Content-Type: application/json" -d "$start_payload" "$DISCORD_WEBHOOK_URL"

          # Clean the link (remove af= parameter if present)
          link=$(echo "$first_link" | awk -F'&af=' '{print $1}')

          # Temporary directory
          temp_dir=$(mktemp -d)

          # Create Python script to extract download URL and filename
          cat << 'EOF' > extract_1fichier_url.py
          import requests
          from bs4 import BeautifulSoup
          import sys

          def extract_1fichier_url(url):
              try:
                  # Initial GET request
                  response = requests.get(url)
                  if response.status_code != 200:
                      print(f"Failed to access URL: Status {response.status_code}")
                      return None, None

                  # Parse HTML to extract adz and filename
                  soup = BeautifulSoup(response.content, 'html.parser')
                  adz_input = soup.find_all('input')
                  if not adz_input:
                      print("Could not find adz input")
                      return None, None
                  adz = str(adz_input[0]).replace('<input name="adz" type="hidden" value="', '').replace('"/>', '')

                  filename_elements = soup.find_all('td', class_='normal')
                  if len(filename_elements) < 2:
                      print("Could not find filename")
                      return None, None
                  filename = str(filename_elements[1]).replace('<td class="normal">', '').replace('</td>',          EOF

          if __name__ == "__main__":
              if len(sys.argv) != 2:
                  print("Usage: python extract_1fichier_url.py <url>")
                  sys.exit(1)
              url = sys.argv[1]
              download_url, filename = extract_1fichier_url(url)
              if download_url and filename:
                  print(f"DOWNLOAD_URL={download_url}")
                  print(f"FILENAME={filename}")
              else:
                  print("Extraction failed")
                  sys.exit(1)
          EOF

          # Run the Python script to extract download URL and filename
          python extract_1fichier_url.py "$link" > extract_output.txt 2>&1
          extract_exit_code=$?

          # Extract download URL and filename from output
          download_url=$(grep "DOWNLOAD_URL=" extract_output.txt | cut -d'=' -f2-)
          filename=$(grep "FILENAME=" extract_output.txt | cut -d'=' -f2-)

          # Check if extraction was successful
          if [ $extract_exit_code -eq 0 ] && [ -n "$download_url" ] && [ -n "$filename" ]; then
            # Get file size using HEAD request through Tor
            file_size=$(curl --socks5-hostname 127.0.0.1:9050 -I "$download_url" 2>/dev/null | grep -i Content-Length | awk '{print $2}' | tr -d '\r')
            if [ -z "$file_size" ] || [ "$file_size" -le 0 ]; then
              echo "Failed to get file size"
              error_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "❌ Failed to Get File Size",
                  description: "Link: \($link)\nCould not retrieve file size",
                  color: 16711680
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt
              git commit -m "Failed to process first link: $first_link"
              git push
              rm -rf "$temp_dir" extract_1fichier_url.py extract_output.txt
              exit 1
            fi

            # Calculate chunk sizes (5 chunks)
            chunk_size=$((file_size / 5))
            remainder=$((file_size % 5))
            if [ $remainder -ne 0 ]; then
              chunk_size=$((chunk_size + 1))
            fi

            # Download chunks concurrently
            pids=()
            for i in {0..4}; do
              start=$((i * chunk_size))
              end=$((start + chunk_size - 1))
              if [ $i -eq 4 ]; then
                end=$((file_size - 1))  # Ensure last chunk includes remainder
              fi
              curl --socks5-hostname 127.0.0.1:9050 -C - --retry 10 --retry-delay 10 -r "$start-$end" "$download_url" --output "$temp_dir/chunk_$i" &
              pids+=($!)
            done

            # Wait for all downloads to complete and check exit codes
            download_failed=false
            for pid in "${pids[@]}"; do
              wait $pid
              if [ $? -ne 0 ]; then
                download_failed=true
              fi
            done

            # Check if all chunks were downloaded
            if [ "$download_failed" = false ] && [ -f "$temp_dir/chunk_0" ] && [ -f "$temp_dir/chunk_1" ] && [ -f "$temp_dir/chunk_2" ] && [ -f "$temp_dir/chunk_3" ] && [ -f "$temp_dir/chunk_4" ]; then
              # Reassemble chunks
              cat "$temp_dir/chunk_0" "$temp_dir/chunk_1" "$temp_dir/chunk_2" "$temp_dir/chunk_3" "$temp_dir/chunk_4" > "$temp_dir/$filename"
              if [ $? -eq 0 ] && [ -f "$temp_dir/$filename" ]; then
                # Upload to Gofile
                gofile_response=$(curl -s -F "file=@$temp_dir/$filename" https://${{ env.server }}.gofile.io/uploadFile)
                if echo "$gofile_response" | jq -e '.status == "ok"' > /dev/null; then
                  gofile_url=$(echo "$gofile_response" | jq -r '.data.downloadPage')
                  # Send success notification
                  upload_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  upload_payload=$(jq -n \
                    --arg url "$gofile_url" \
                    --arg link "$first_link" \
                    --arg time "$upload_time" '{
                      embeds: [{
                        title: "📤 File Uploaded to Gofile!",
                        fields: [
                          { name: "Download Link", value: "[Download from Gofile](\($url))", inline: true },
                          { name: "Source 1fichier Link", value: "\($link)", inline: true },
                          { name: "Uploaded At", value: $time, inline: true }
                        ],
                        color: 5814783
                      }]
                    }')
                  curl -X POST -H "Content-Type: application/json" -d "$upload_payload" "$DISCORD_WEBHOOK_URL"
                  # Remove first line from fichier_download_list.txt
                  tail -n +2 fichier_download_list.txt > temp.txt
                  mv temp.txt fichier_download_list.txt
                  git config user.name "GitHub Actions"
                  git config user.email "actions@github.com"
                  git add fichier_download_list.txt
                  if [ -s fichier_download_list.txt ]; then
                    git commit -m "Processed first link, removed from fichier_download_list.txt"
                  else
                    git commit -m "Processed last link, fichier_download_list.txt is now empty"
                  fi
                  git push
                else
                  echo "Failed to upload to Gofile."
                  error_payload=$(jq -n --arg link "$first_link" '{
                    embeds: [{
                      title: "❌ Failed to Upload to Gofile",
                      description: "Link: \($link)",
                      color: 16711680
                    }]
                  }')
                  curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
                  # Keep the link and commit
                  git config user.name "GitHub Actions"
                  git config user.email "actions@github.com"
                  git add fichier_download_list.txt
                  git commit -m "Failed to process first link: $first_link"
                  git push
                fi
              else
                echo "Failed to reassemble chunks."
                error_payload=$(jq -n --arg link "$first_link" '{
                  embeds: [{
                    title: "❌ Failed to Reassemble File",
                    description: "Link: \($link)\nChunk reassembly failed",
                    color: 16711680
                  }]
                }')
                curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git add fichier_download_list.txt
                git commit -m "Failed to process first link: $first_link"
                git push
              fi
            else
              echo "Download failed: One or more chunks missing or download failed."
              cat extract_output.txt
              error_payload=$(jq -n --arg link "$first_link" '{
                embeds: [{
                  title: "❌ Failed to Download from 1fichier",
                  description: "Link: \($link)\nCheck logs for details",
                  color: 16711680
                }]
              }')
              curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add fichier_download_list.txt
              git commit -m "Failed to process first link: $first_link"
              git push
            fi
          else
            echo "Failed to extract download URL or filename."
            cat extract_output.txt
            error_payload=$(jq -n --arg link "$first_link" '{
              embeds: [{
                title: "❌ Failed to Extract 1fichier Download URL",
                description: "Link: \($link)\nCheck logs for details",
                color: 16711680
              }]
            }')
            curl -X POST -H "Content-Type: application/json" -d "$error_payload" "$DISCORD_WEBHOOK_URL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $first_link"
            git push
          fi

          # Clean up
          rm -rf "$temp_dir" extract_1fichier_url.py extract_output.txt
```
