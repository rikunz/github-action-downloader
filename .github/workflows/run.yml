name: 1fichier Download and Upload to Gofile with Notifications

on:
  push:
    branches:
      - fichier_windows
  pull_request:
    branches:
      - fichier_windows
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: windows-latest
    timeout-minutes: 30  # Prevent early termination

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install dependencies
        shell: powershell
        run: |
          choco install -y jq python googlechrome
          pip install requests beautifulsoup4 selenium
          # Download and extract ChromeDriver
          $chromeVersion = (Get-Item "C:\Program Files\Google\Chrome\Application\chrome.exe").VersionInfo.ProductVersion -replace '\.\d+$'
          $driverUrl = "https://storage.googleapis.com/chrome-for-testing-public/$chromeVersion/win64/chromedriver-win64.zip"
          Invoke-WebRequest -Uri $driverUrl -OutFile chromedriver.zip
          Expand-Archive -Path chromedriver.zip -DestinationPath .
          Move-Item -Path chromedriver-win64\chromedriver.exe -Destination .
          Remove-Item -Path chromedriver.zip, chromedriver-win64 -Recurse
          # Log versions
          Write-Host "Chrome version: $chromeVersion"
          ./chromedriver.exe --version
          python --version
          pip list

      - name: Get Gofile server
        id: gofile_server
        shell: powershell
        run: |
          $response = Invoke-RestMethod -Uri "https://api.gofile.io/servers"
          Write-Host "Raw Gofile API response: $($response | ConvertTo-Json -Depth 10)"

          $preferredZones = @("asia", "eu", "na")
          $server = "store1"

          if ($response.data.serversAllZone) {
            foreach ($zone in $preferredZones) {
              $candidate = $response.data.serversAllZone | Where-Object { $_.zone -eq $zone } | Select-Object -First 1 -ExpandProperty name
              if ($candidate) {
                $server = $candidate
                break
              }
            }
            Write-Host "Selected server based on preferred zone: $server"
          } else {
            Write-Host "Failed to get valid servers list, using fallback: $server"
          }

          "server=$server" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Process First 1fichier Link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: powershell
        run: |
          if (-not (Test-Path "fichier_download_list.txt")) {
            Write-Host "No fichier_download_list.txt found, exiting"
            exit 0
          }

          $firstLink = Get-Content -Path "fichier_download_list.txt" -TotalCount 1
          if (-not $firstLink) {
            Write-Host "fichier_download_list.txt is empty, exiting"
            exit 0
          }

          Write-Host "Processing $firstLink"

          # Create download directory
          $downloadDir = "$env:GITHUB_WORKSPACE\downloads"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          Write-Host "Created download directory: $downloadDir"
          Get-Item $downloadDir | Format-List -Property *

          $startTime = (Get-Date -AsUTC).ToString("yyyy-MM-ddTHH:mm:ssZ")
          $startPayload = @{
            embeds = @(
              @{
                title = "📥 Starting 1fichier Download"
                fields = @(
                  @{ name = "1fichier Link"; value = $firstLink; inline = $true }
                  @{ name = "Started At"; value = $startTime; inline = $true }
                )
                color = 5814783
              }
            )
          } | ConvertTo-Json -Depth 10
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $startPayload

          $link = $firstLink -replace '&af=.*$', '' -replace '\r\n', ''

          Write-Host "Starting download with Selenium..."
          python -u scripts\selenium_download.py $link 2>&1 | Tee-Object -FilePath selenium_download.log
          $seleniumExitCode = $LASTEXITCODE

          if ($seleniumExitCode -ne 0) {
            Write-Host "Failed to trigger download with Selenium."
            $errorPayload = @{
              embeds = @(
                @{
                  title = "❌ Failed to Trigger Download from 1fichier"
                  description = "Link: $firstLink`nCheck logs, screenshots, and debug files for details"
                  color = 16711680
                }
              )
            } | ConvertTo-Json -Depth 10
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $errorPayload
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $firstLink"
            git push
            exit 1
          }

          Write-Host "Download completed by Selenium script."
          Write-Host "Disk space:"
          Get-CimInstance -ClassName Win32_LogicalDisk | Format-Table -Property DeviceID, @{Label="Size(GB)";Expression={[math]::Round($_.Size/1GB,2)}}, @{Label="Free(GB)";Expression={[math]::Round($_.FreeSpace/1GB,2)}}
          Write-Host "Running Chrome processes:"
          Get-Process | Where-Object { $_.Name -like "*chrome*" -or $_.Name -like "*chromedriver*" } | Select-Object -Property Id, ProcessName, CPU | Format-Table -AutoSize > chrome_processes_final.log
          Get-Content chrome_processes_final.log

          Write-Host "Checking download directory contents..."
          Get-ChildItem -Path $downloadDir | Format-Table -AutoSize

          Write-Host "Starting Gofile upload process..."
          $minSize = 102400  # 100KB minimum size
          $completedFile = Get-ChildItem -Path $downloadDir -File | Where-Object { $_.Name -notlike "*.crdownload" -and $_.Name -notlike "*.tmp" -and $_.Name -notlike ".org.chromium.*" } | Select-Object -First 1 -ExpandProperty FullName
          
          if (-not $completedFile) {
            Write-Host "No valid completed file found in download directory."
            $errorPayload = @{
              embeds = @(
                @{
                  title = "❌ No Valid File Downloaded from 1fichier"
                  description = "Link: $firstLink`nCheck logs, screenshots, and debug files for details"
                  color = 16711680
                }
              )
            } | ConvertTo-Json -Depth 10
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $errorPayload
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $firstLink"
            git push
            exit 1
          }

          $completedBasename = [System.IO.Path]::GetFileName($completedFile)
          $size = (Get-Item $completedFile).Length
          if ($size -lt $minSize) {
            Write-Host "File $completedBasename is too small ($size bytes), failing..."
            $errorPayload = @{
              embeds = @(
                @{
                  title = "❌ Downloaded File Too Small"
                  description = "Link: $firstLink`nFile size: $size bytes`nCheck logs, screenshots, and debug files for details"
                  color = 16711680
                }
              )
            } | ConvertTo-Json -Depth 10
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $errorPayload
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $firstLink"
            git push
            exit 1
          }

          Write-Host "Uploading file: $completedFile (size: $size bytes)"
          $gofileResponse = curl -s -F "file=@$completedFile" "https://$env:server.gofile.io/uploadFile"
          Write-Host "Gofile response: $gofileResponse"
          
          if ($gofileResponse | ConvertFrom-Json | Select-Object -ExpandProperty status -eq "ok") {
            $gofileUrl = $gofileResponse | ConvertFrom-Json | Select-Object -ExpandProperty data | Select-Object -ExpandProperty downloadPage
            $fileInfo = "- $completedBasename ($([math]::Round($size/1MB,2)) MB)"
            $uploadTime = (Get-Date -AsUTC).ToString("yyyy-MM-ddTHH:mm:ssZ")
            $uploadPayload = @{
              embeds = @(
                @{
                  title = "📤 File Uploaded to Gofile!"
                  description = "Downloaded files:`n$fileInfo"
                  fields = @(
                    @{ name = "Download Link"; value = "[Download from Gofile]($gofileUrl)"; inline = $true }
                    @{ name = "Source 1fichier Link"; value = $firstLink; inline = $true }
                    @{ name = "Uploaded At"; value = $uploadTime; inline = $true }
                  )
                  color = 5814783
                }
              )
            } | ConvertTo-Json -Depth 10
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $uploadPayload
            
            # Remove processed link from list
            Get-Content -Path fichier_download_list.txt | Select-Object -Skip 1 | Set-Content -Path temp.txt
            Move-Item -Path temp.txt -Destination fichier_download_list.txt -Force
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            if ((Get-Content fichier_download_list.txt | Measure-Object -Line).Lines -gt 0) {
              git commit -m "Processed first link, removed from fichier_download_list.txt"
            } else {
              git commit -m "Processed last link, fichier_download_list.txt is now empty"
            }
            git push
          } else {
            Write-Host "Failed to upload to Gofile."
            $errorPayload = @{
              embeds = @(
                @{
                  title = "❌ Failed to Upload to Gofile"
                  description = "Link: $firstLink`nGofile response: $gofileResponse"
                  color = 16711680
                }
              )
            } | ConvertTo-Json -Depth 10
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $errorPayload
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add fichier_download_list.txt
            git commit -m "Failed to process first link: $firstLink"
            git push
            exit 1
          }

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_page.html
            final_page.html
            initial_screenshot.png
            debug_screenshot.png
            final_screenshot.png
            selenium_download.log
            chromedriver.log
            chrome_processes_final.log
          if-no-files-found: warn